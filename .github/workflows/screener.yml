name: Crypto Screener Bot

on:
  schedule:
    # التشغيل تلقائيًا كل 5 دقائق (أو حسب التوقيت المناسب لك)
    - cron: '*/5 * * * *'
  workflow_dispatch: # يتيح لك تشغيل الفحص يدويًا بضغطة زر من GitHub

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: تثبيت المكتبات المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tradingview-screener tvdatafeed

      - name: تشغيل سكريبت الفحص وتمرير متغيرات التلغرام
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
