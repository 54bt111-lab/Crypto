name: Crypto Screener Bot

on:
  schedule:
    # تشغيل الجوب كل 12 دقيقة (حيث يتكفل الـ Loop الداخلي بالفحص كل 3 دقائق)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت المكتبات المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel pandas requests tradingview-screener
          pip install --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: تشغيل سكريبت الفحص بتكرار كل 3 دقائق
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          # حلقة تكرار تعمل 4 مرات، بانتظار 180 ثانية (3 دقائق) بين كل فحص
          for i in {1..4}; do
            echo "⏰ بدء الفحص رقم $i..."
            python main.py
            if [ $i -lt 4 ]; then
              echo "💤 الانتظار 3 دقائق قبل الفحص التالي..."
              sleep 180
            fi
          done
