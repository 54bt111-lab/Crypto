name: Crypto Screener Bot

on:
  schedule:
    # تشغيل تلقائي كل 5 دقائق على مدار 24 ساعة
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # رفع الإصدار إلى 3.12 لتوافق المكتبات

      - name: تثبيت المكتبات المطلوبة
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tradingview-screener
          pip install git+https://github.com/mraniki/ttvdatafeed.git

      - name: تشغيل سكريبت الفحص وتمرير متغيرات التلغرام
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py
